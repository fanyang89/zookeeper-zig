name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: mise run fmt-check
            cache-zig: false
            system-rocksdb: false
            timeout-minutes: 5
          - name: Lint
            command: zig build check-zig -Doptimize=ReleaseSafe -Dsystem-rocksdb=true --summary all
            cache-zig: true
            system-rocksdb: true
            timeout-minutes: 25
          - name: Build
            command: mise run build -- -Dsystem-rocksdb=true --summary all
            cache-zig: true
            system-rocksdb: true
            timeout-minutes: 20
          - name: Unit tests
            command: |
              zig build check-zig -Dsystem-rocksdb=true --summary all
              timeout --foreground --kill-after=10s 3m zig build test -Dsystem-rocksdb=true --summary all
            cache-zig: true
            system-rocksdb: true
            timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: jdx/mise-action@v4

      - name: Cache Zig dependencies
        if: matrix.cache-zig
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-pkg
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Install system RocksDB
        if: matrix.system-rocksdb
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librocksdb-dev libsnappy-dev pkg-config

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
