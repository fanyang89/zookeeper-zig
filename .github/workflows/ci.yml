name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
      options: --security-opt seccomp=unconfined
    timeout-minutes: ${{ matrix.timeout-minutes }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: zig fmt --check build.zig src
            cache-zig: false
            system-rocksdb: false
            timeout-minutes: 5
          - name: Lint
            command: zig build check-zig -Doptimize=ReleaseSafe -Dsystem-rocksdb=true --summary all
            cache-zig: true
            system-rocksdb: true
            timeout-minutes: 25
          - name: Build
            command: zig build -Dsystem-rocksdb=true --summary all
            cache-zig: true
            system-rocksdb: true
            timeout-minutes: 20
          - name: Unit tests
            command: |
              zig build check-zig -Dsystem-rocksdb=true --summary all
              timeout --foreground --kill-after=10s 3m zig build test -Dsystem-rocksdb=true --summary all
              timeout --foreground --kill-after=10s 3m zig build test-storage-failure -Dsystem-rocksdb=true --summary all
              timeout --foreground --kill-after=10s 3m zig build test-listener-failure -Dsystem-rocksdb=true --summary all
              timeout --foreground --kill-after=10s 3m zig build test-backup-restore -Dsystem-rocksdb=true --summary all
              timeout --foreground --kill-after=10s 3m zig build test-connection-limits -Dsystem-rocksdb=true --summary all
              timeout --foreground --kill-after=10s 3m zig build test-handshake-timeout -Dsystem-rocksdb=true --summary all
            cache-zig: true
            system-rocksdb: true
            timeout-minutes: 20
          - name: ThreadSanitizer
            command: |
              bash tools/patch-zig-tsan.sh
              timeout --foreground --kill-after=10s 8m zig build test-tsan --summary all
            cache-zig: true
            system-rocksdb: false
            timeout-minutes: 15
          - name: Fuzz smoke
            command: |
              zig build fuzz-import -Dsystem-rocksdb=true --summary all
              timeout --foreground --kill-after=10s 10m zig build test-fuzz-smoke -Dsystem-rocksdb=true --summary all
            cache-zig: true
            system-rocksdb: true
            timeout-minutes: 15
          - name: TLA+
            command: |
              timeout --foreground --kill-after=10s 8m bash tools/tla-check.sh
              timeout --foreground --kill-after=10s 8m bash tools/apalache-check.sh
            cache-zig: false
            system-rocksdb: false
            timeout-minutes: 15

    steps:
      - name: Install Fedora toolchain
        run: |
          dnf install --assumeyes --setopt=install_weak_deps=False \
            binutils cmake git make ninja-build python3 zig java-25-openjdk-headless
          if [[ "${{ matrix.system-rocksdb }}" == true ]]; then
            dnf install --assumeyes --setopt=install_weak_deps=False \
              pkgconf-pkg-config rocksdb-devel snappy-devel
          fi
          test "$(zig version)" = "0.16.0"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Zig dependencies
        if: matrix.cache-zig
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-pkg
          key: zig-fedora-44-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-fedora-44-${{ runner.arch }}-

      - name: Cache formal verification toolchains
        if: matrix.name == 'TLA+'
        uses: actions/cache@v4
        with:
          path: ~/.cache/zookeeper-zig
          key: formal-tools-tla-1.7.0-apalache-0.62.2-${{ runner.arch }}

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  interop:
    name: Interop (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
      options: --security-opt seccomp=unconfined
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      ZOOKEEPER_MAVEN_MIRROR: central
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: java-client
            command: zig build test-interop-java -Dsystem-rocksdb=true --summary all
          - suite: upstream-server
            command: zig build test-upstream-server -Dsystem-rocksdb=true --summary all

    steps:
      - name: Install Fedora toolchain
        run: |
          dnf install --assumeyes --setopt=install_weak_deps=False \
            binutils cmake git hostname make ninja-build zig \
            python3 maven pkgconf-pkg-config rocksdb-devel snappy-devel
          test "$(zig version)" = "0.16.0"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Cache Zig dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-pkg
          key: zig-fedora-44-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-fedora-44-${{ runner.arch }}-

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: interop-maven-zookeeper-3.9.5-${{ runner.arch }}-v1

      - name: Cache Apache ZooKeeper source
        uses: actions/cache@v4
        with:
          path: ~/.cache/zookeeper-zig
          key: interop-zookeeper-src-3.9.5-${{ runner.arch }}-v1

      - name: Run ${{ matrix.suite }}
        run: ${{ matrix.command }}
