name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
      options: --security-opt seccomp=unconfined
    timeout-minutes: ${{ matrix.timeout-minutes }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: zig fmt --check build.zig src
            cache-zig: false
            system-rocksdb: false
            timeout-minutes: 5
          - name: Lint
            command: zig build check-zig -Doptimize=ReleaseSafe -Dsystem-rocksdb=true --summary all
            cache-zig: true
            system-rocksdb: true
            timeout-minutes: 25
          - name: Build
            command: zig build -Dsystem-rocksdb=true --summary all
            cache-zig: true
            system-rocksdb: true
            timeout-minutes: 20
          - name: Unit tests
            command: |
              zig build check-zig -Dsystem-rocksdb=true --summary all
              timeout --foreground --kill-after=10s 3m zig build test -Dsystem-rocksdb=true --summary all
            cache-zig: true
            system-rocksdb: true
            timeout-minutes: 20

    steps:
      - name: Install Fedora toolchain
        run: |
          dnf install --assumeyes --setopt=install_weak_deps=False \
            binutils cmake git make ninja-build zig
          if [[ "${{ matrix.system-rocksdb }}" == true ]]; then
            dnf install --assumeyes --setopt=install_weak_deps=False \
              pkgconf-pkg-config rocksdb-devel snappy-devel
          fi
          test "$(zig version)" = "0.16.0"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Zig dependencies
        if: matrix.cache-zig
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-pkg
          key: zig-fedora-44-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-fedora-44-${{ runner.arch }}-

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
