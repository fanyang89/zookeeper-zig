min_version = "2026.7.13"

[tools]
zig = "0.16.0"

[env]
ZOOKEEPER_VERSION = "3.9.5"

[tasks.fmt]
run = "zig fmt build.zig src"

[tasks.fmt-check]
run = "zig fmt --check build.zig src"

[tasks.lint]
run = "zig build check-zig -Doptimize=ReleaseSafe --summary all"

[tasks.test]
run = "zig build test --summary all"

[tasks.test-interop-java]
run = "zig build test-interop-java --summary all"

[tasks.test-upstream-server]
run = "zig build test-upstream-server --summary all"

[tasks.test-jepsen-smoke]
run = "zig build test-jepsen-smoke --summary all"

[tasks.test-jepsen]
run = "zig build test-jepsen --summary all"

[tasks.fuzz-import]
run = "zig build fuzz-import --summary all"

[tasks.test-fuzz-smoke]
run = "zig build test-fuzz-smoke --summary all"

[tasks.fuzz-wire]
run = "zig build fuzz-wire --summary all"

[tasks.tla-check]
run = "bash tools/tla-check.sh"

[tasks.apalache-check]
run = "bash tools/apalache-check.sh"

[tasks.patch-zig-tsan]
run = "bash tools/patch-zig-tsan.sh"

[tasks.test-tsan]
run = """
bash tools/patch-zig-tsan.sh
zig build test-tsan --summary all
"""
