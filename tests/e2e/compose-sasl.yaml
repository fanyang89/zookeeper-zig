services:
  zookeeper:
    image: zookeeper:3.9.5-jre-17
    ports:
      - "127.0.0.1:22381:2181"
    volumes:
      - "./sasl-jaas.conf:/conf/sasl-jaas.conf:ro"
    environment:
      SERVER_JVMFLAGS: >-
        -Djava.security.auth.login.config=/conf/sasl-jaas.conf
      ZOO_4LW_COMMANDS_WHITELIST: srvr
      ZOO_ADMINSERVER_ENABLED: "false"
      ZOO_CFG_EXTRA: >-
        authProvider.1=org.apache.zookeeper.server.auth.SASLAuthenticationProvider
        sessionRequireClientSASLAuth=true
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
