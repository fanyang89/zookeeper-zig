x-zookeeper-environment: &zookeeper-environment
  ZOO_4LW_COMMANDS_WHITELIST: srvr
  ZOO_ADMINSERVER_ENABLED: "false"
  ZOO_SERVERS: >-
    server.1=zoo1:2888:3888;2181
    server.2=zoo2:2888:3888;2181
    server.3=zoo3:2888:3888;2181

x-zookeeper-healthcheck: &zookeeper-healthcheck
  test: ["CMD-SHELL", "zkServer.sh status"]
  interval: 2s
  timeout: 2s
  retries: 30
  start_period: 5s

services:
  zoo1:
    image: zookeeper:3.9.5-jre-17
    hostname: zoo1
    ports:
      - "127.0.0.1:22181:2181"
    environment:
      <<: *zookeeper-environment
      ZOO_MY_ID: 1
    healthcheck: *zookeeper-healthcheck

  zoo2:
    image: zookeeper:3.9.5-jre-17
    hostname: zoo2
    ports:
      - "127.0.0.1:22182:2181"
    environment:
      <<: *zookeeper-environment
      ZOO_MY_ID: 2
    healthcheck: *zookeeper-healthcheck

  zoo3:
    image: zookeeper:3.9.5-jre-17
    hostname: zoo3
    ports:
      - "127.0.0.1:22183:2181"
    environment:
      <<: *zookeeper-environment
      ZOO_MY_ID: 3
    healthcheck: *zookeeper-healthcheck
